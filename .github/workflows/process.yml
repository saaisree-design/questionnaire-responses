name: process responses

on:
  push:
    paths:
      - "responses/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: process-responses
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find new responses
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          NEW=""
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            NEW=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'responses/*.json' | tr '\n' ' ')
          fi
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "New response files: $NEW"

      - name: Build responses.csv
        run: python collate.py

      - name: Score and write reports
        run: python score.py

      - name: Commit changes
        run: |
          git config user.name "report bot"
          git config user.email "actions@github.com"
          git add responses.csv scores.csv reports
          if git diff --staged --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Rebuild reports"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Email the report
        env:
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          NOTIFY_FROM: ${{ secrets.NOTIFY_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python notify.py ${{ steps.changed.outputs.new }}
