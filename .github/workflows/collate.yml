name: collate responses
# Whenever a new response file lands, rebuild responses.csv at the repo root
# so you have one file to download instead of many.
on:
  push:
    paths: ["responses/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collate.py
      - name: commit the csv if it changed
        run: |
          git config user.name "collate bot"
          git config user.email "actions@github.com"
          git add responses.csv
          git diff --staged --quiet || git commit -m "rebuild responses.csv"
          git push
